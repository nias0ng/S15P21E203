spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: info
    com.hyanghae.backend: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: off
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

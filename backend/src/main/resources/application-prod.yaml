spring:
  config:
    activate:
      on-profile: prod

# ⚠ 자연어 추천의 호출량 제한이 이 값에 걸려 있습니다. 배포 구성을 아는 쪽이 정해야 합니다.
#
# 비회원은 IP 로 셉니다. 앞에 리버스 프록시(nginx 등)가 있으면 getRemoteAddr() 가 전부
# 프록시 IP 가 되어 **비회원 전체가 한 바구니를 나눠 씁니다.** 몇 명만 불러도 나머지가
# 429 를 받습니다.
#
#   프록시가 있고, 백엔드 포트가 프록시를 통해서만 닿는다  -> framework 로 켜십시오.
#                                                            X-Forwarded-For 를 읽습니다
#   백엔드 포트가 외부에 직접 열려 있다                    -> none 그대로 두십시오.
#                                                            켜면 헤더를 넣어 제한을 우회합니다
#
# 켤 때는 프록시가 X-Forwarded-For 를 직접 덮어쓰는지(클라이언트가 보낸 값을 그대로
# 넘기지 않는지) 함께 확인해야 합니다.
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

logging:
  level:
    root: info
    com.hyanghae.backend: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: off
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

# 후기 요약 배치입니다. 기본값은 ReviewAnalysisProperties 에 있고 여기서는 운영에서
# 바꿔야 하는 값만 덮어씁니다.
#
# 켜기 전에 GMS_API_KEY 를 배포 디렉터리의 .env 에 넣어야 합니다. 키 없이 켜면 애플리케이션이
# 시작되지 않습니다. 매 주기마다 401 을 받으며 도는 것보다 배포 시점에 실패하는 편이 낫습니다.
hyanghae:
  # 업로드 이미지를 어디에 쌓을지입니다. 기본은 꺼짐(서버 디스크)이고, 인프라 준비가 끝나면
  # 배포 디렉터리의 .env 에 아래 값을 넣어 켭니다. 코드 배포 없이 전환됩니다.
  #
  #   IMAGE_STORAGE_S3_ENABLED=true
  #   IMAGE_STORAGE_S3_BUCKET=...
  #   IMAGE_STORAGE_S3_REGION=ap-northeast-2
  #   IMAGE_STORAGE_S3_PUBLIC_BASE_URL=https://djpgc0m2v54q1.cloudfront.net
  #   IMAGE_STORAGE_S3_KEY_PREFIX=prod
  #
  # ⚠ KEY_PREFIX 를 비워 두면 개발과 운영이 한 버킷의 같은 경로에 섞어 씁니다. 개발에서
  # 테스트로 올린 사진이 운영 이미지 틈에 쌓이고 지울 때 구분이 안 됩니다.
  #
  # ⚠ 켜기 전에 확인할 것이 둘입니다. 필요한 값이 비어 있으면 애플리케이션이 시작되지 않고,
  # 자격 증명(EC2 인스턴스 역할 또는 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)이 없으면 첫
  # 업로드에서 실패합니다.
  #
  # ⚠ public-base-url 은 CloudFront 주소입니다. S3 객체 주소를 넣으면 버킷이 CloudFront 만
  # 읽도록 잠겨 있어 사용자가 403 을 받습니다. 자세한 절차는
  # docs/image-upload-s3-handover.md 를 보십시오.
  storage:
    s3:
      enabled: ${IMAGE_STORAGE_S3_ENABLED:false}
      bucket: ${IMAGE_STORAGE_S3_BUCKET:}
      region: ${IMAGE_STORAGE_S3_REGION:}
      public-base-url: ${IMAGE_STORAGE_S3_PUBLIC_BASE_URL:}
      key-prefix: ${IMAGE_STORAGE_S3_KEY_PREFIX:}
      # 주소에 나타나는 프리픽스입니다. 비워 두면 key-prefix 와 같습니다.
      #
      # CloudFront 배포가 버킷 뿌리를 가리키면 그대로 두십시오. 배포의 오리진 경로가 이미
      # 프리픽스를 가리키면 주소에 두 번 들어가 404 가 나므로, 그때만 "-" 로 두어 주소에서
      # 뺍니다. 확인하는 방법은 docs/image-upload-s3-handover.md 를 보십시오.
      public-path-prefix: ${IMAGE_STORAGE_S3_PUBLIC_PATH_PREFIX:}

  auth:
    jwt-secret: ${JWT_SECRET}
    cookie:
      secure: true
  review-analysis:
    enabled: ${REVIEW_ANALYSIS_ENABLED:false}
    gms:
      api-key: ${GMS_API_KEY:}
      model: ${GMS_MODEL:gpt-5-nano}

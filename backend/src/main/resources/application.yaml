spring:
  application:
    name: backend

  # 게시글 이미지 업로드의 바깥 울타리입니다. 여기 걸리면 요청 본문을 다 읽기 전에 잘라내므로
  # 거대한 파일이 디스크와 대역폭을 먹는 것을 막습니다. 대신 응답은 공용 413 이라 어떤 제한에
  # 걸렸는지 알려주지 못합니다.
  #
  # 그래서 hyanghae.community.post-image.max-size(기본 5MB)보다 넉넉하게 잡습니다. 사람이 실제로
  # 만나는 제한은 애플리케이션 쪽이고, 그쪽은 COMMUNITY_IMAGE_TOO_LARGE 로 이유를 알려줍니다.
  # 이 값을 더 작게 두면 애플리케이션 검사에 닿지 못해 그 에러 코드가 영영 나가지 않습니다.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  # 회원가입 이메일 인증번호를 보내는 SMTP 입니다. 접속 정보는 환경변수로만 받습니다.
  # 기본값은 로컬 Mailpit(compose.manual-test.yaml) 에 맞춰 두어, 설정 없이 띄워도 메일이
  # 바깥으로 나가지 않습니다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # 메일 서버가 응답하지 않으면 요청 스레드가 무한정 묶입니다. 동기 전송이라 끊어 줍니다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 메일 서버 상태를 /actuator/health 에 넣지 않습니다. 넣으면 SMTP 가 잠깐 멈춘 것만으로
# 백엔드 전체가 DOWN 으로 보여, 인증 메일과 상관없는 요청까지 멈춘 서버로 취급됩니다.
management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

hyanghae:
  recommendation:
    personalized:
      view-refresh-threshold: ${PERSONALIZED_RECOMMENDATION_VIEW_THRESHOLD:10}
      max-age: ${PERSONALIZED_RECOMMENDATION_MAX_AGE:24h}
      offer-ttl: ${PERSONALIZED_RECOMMENDATION_OFFER_TTL:10m}
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    max-sessions-per-user: 2
    issuer: hyanghae
    jwt-secret: ${JWT_SECRET:}
    enforce-http-authorization: true
    cookie:
      name: refresh_token
      secure: true
      same-site: Strict
    email-verification:
      code-ttl: 5m
      resend-cooldown: 60s
      max-attempts: 5
      max-sends-per-hour: 5
      verified-ttl: 30m
      from: ${MAIL_FROM:no-reply@hyanghae.local}
    google:
      # Google 로그인(OAuth 2.0). 셋 중 하나라도 비어 있으면 Google 로그인을 쓰지 않습니다.
      # redirect-uri 는 Google Cloud 콘솔의 "승인된 리디렉션 URI"와 똑같아야 합니다.
      #   로컬: http://localhost:5173/api/v1/auth/google/callback (vite 프록시를 거칩니다)
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      authorization-ttl: 10m
      signup-ticket-ttl: 10m

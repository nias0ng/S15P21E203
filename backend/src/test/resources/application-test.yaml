spring:
  config:
    activate:
      on-profile: test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

hyanghae:
  auth:
    jwt-secret: test-jwt-secret-must-be-at-least-thirty-two-bytes
    enforce-http-authorization: false
    cookie:
      secure: false

  # 테스트는 실제 AWS 를 건드리지 않습니다. 환경변수로 켤 수 있게 두지 않고 여기서 못을
  # 박습니다.
  #
  # 통합 테스트 대부분이 @ActiveProfiles({"manual-test", "test"}) 입니다. manual-test 프로필은
  # IMAGE_STORAGE_S3_ENABLED 를 읽으므로, 그 변수가 켜진 셸에서 테스트를 돌리면 게시글 이미지와
  # 프로필 사진 테스트가 공용 버킷에 쓰게 됩니다. 수동 확인을 한 번 하고 변수를 지우지 않은
  # 셸이면 충분히 일어납니다. 파일 이름이 UUID 라 그렇게 쌓인 객체는 나중에 골라낼 수 없습니다.
  #
  # 실제 AWS 확인은 RealS3ConnectivityTest 가 따로 맡습니다. 그쪽은 명시적으로 켜야 돌고
  # 개발 프리픽스에서만 돌며 올린 것을 스스로 지웁니다.
  storage:
    s3:
      enabled: false

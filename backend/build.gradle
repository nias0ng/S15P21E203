plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hyanghae'
version = '0.0.1-SNAPSHOT'
description = 'Hyanghae backend service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 로컬 데이터 도구는 서버 JAR에 포함하지 않습니다.
sourceSets {
    localSeed
}

configurations {
    localSeedImplementation.extendsFrom implementation
    localSeedRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    localSeedImplementation 'org.springframework.security:spring-security-crypto'
    testImplementation sourceSets.localSeed.output
    testImplementation 'org.springframework.security:spring-security-crypto'
}

tasks.register('seedLocal', JavaExec) {
    group = 'application'
    description = '로컬 활동 데이터 보충 (SEED_MODE=reset으로 초기화)'
    classpath = sourceSets.localSeed.runtimeClasspath
    mainClass = 'com.hyanghae.seed.LocalSeed'
}

tasks.register('localSeedDist', Sync) {
    dependsOn tasks.named('localSeedClasses')
    into layout.buildDirectory.dir('local-seed')
    from(sourceSets.localSeed.output) { into 'classes' }
    from(configurations.localSeedRuntimeClasspath) { into 'lib' }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hyanghae'
version = '0.0.1-SNAPSHOT'
description = 'Hyanghae backend service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// AWS SDK 는 Spring Boot BOM 이 관리하지 않아 자체 BOM 으로 버전을 맞춥니다.
// s3 하나만 쓰더라도 내부 의존(auth, http-client 등) 버전이 어긋나면 런타임에 깨집니다.
ext {
    awsSdkVersion = '2.31.78'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    // 실제 AWS 계정 없이 S3 저장소를 검증합니다. 목으로 대신하면 SDK 가 실제로 무엇을
    // 보내는지(Content-Type, 키 경로)를 확인하지 못합니다.
    testImplementation 'org.testcontainers:localstack'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // 통합 테스트가 쓰는 스프링 컨텍스트가 30개를 넘어, 테스트 워커 기본 힙(512MB)으로는
    // 마지막 패키지(com.hyanghae.seed)를 돌 때 OutOfMemoryError 로 워커가 죽습니다.
    maxHeapSize = '1g'
    // 팀 표준 명령이 `./gradlew test` 라 리포트를 따로 부르지 않아도 나오게 합니다.
    // finalizedBy 이므로 테스트가 실패해도 그때까지의 리포트는 남습니다.
    finalizedBy tasks.named('jacocoTestReport')
}

// 커버리지는 측정만 하고 임계값은 걸지 않습니다. 기준선을 먼저 기록한 뒤
// 도메인별 목표를 정합니다.
jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    // JPA 복합키를 리포트에서 뺍니다. equals/hashCode 를 영속성 컨텍스트만 호출하므로
    // 테스트가 직접 실행할 일이 없는데, Objects.equals 하나가 분기 4개로 잡혀 향수 도메인
    // 분기 커버리지를 25%p 넘게 끌어내렸습니다. 남은 수치가 곧 손댈 곳이 되도록 뺍니다.
    classDirectories.setFrom(files(classDirectories.files.collect { dir ->
        fileTree(dir) { exclude '**/entity/*Id.class' }
    }))

    reports {
        html.required = true
        xml.required = true
    }
}

// 로컬 데이터 도구는 서버 JAR에 포함하지 않습니다.
sourceSets {
    localSeed
}

configurations {
    localSeedImplementation.extendsFrom implementation
    localSeedRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    localSeedImplementation 'org.springframework.security:spring-security-crypto'
    testImplementation sourceSets.localSeed.output
    testImplementation 'org.springframework.security:spring-security-crypto'
}

tasks.register('seedLocal', JavaExec) {
    group = 'application'
    description = '로컬 활동 데이터 보충 (SEED_MODE=reset으로 초기화)'
    classpath = sourceSets.localSeed.runtimeClasspath
    mainClass = 'com.hyanghae.seed.LocalSeed'
}

tasks.register('seedPresentation', JavaExec) {
    group = 'application'
    description = '440번 시연 SEED: 기본 plan, replace/verify/reset-actors는 명시적으로 지정'
    classpath = sourceSets.localSeed.runtimeClasspath
    mainClass = 'com.hyanghae.seed.PresentationSeed'
}

tasks.register('localSeedDist', Sync) {
    dependsOn tasks.named('localSeedClasses')
    into layout.buildDirectory.dir('local-seed')
    from(sourceSets.localSeed.output) { into 'classes' }
    from(configurations.localSeedRuntimeClasspath) { into 'lib' }
}

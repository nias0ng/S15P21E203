<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="향을 탐색하고, 발견하고, 기록하는 향수 추천 서비스"
    />
    <title>향해 · 향수 추천 서비스</title>

    <!--
      웹폰트. 제목은 Noto Serif KR, 본문은 Noto Sans KR 입니다.
      CSS 의 @import 로 넣으면 스타일시트를 받은 뒤에야 폰트 요청이 시작되므로
      여기 <link> 로 둡니다. display=swap 이라 폰트가 늦어도 글자는 먼저 보입니다.
      굵기는 실제로 쓰는 것만 받습니다 (본문 400·500·700, 제목 600·700).
      Noto Serif KR 400 은 3D 지도 위의 향해 일지가 씁니다 — 3D 검색창(엔진 #stage)과 같은 글꼴 · 굵기입니다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap"
    />
    <!--
      로딩 커튼의 퍼센트 숫자(features/map 의 SceneBootCurtain) — Noto Serif KR 900 을 숫자 · % 열한 글자만 받습니다.
      위 링크에 900 을 더하면 한글 조각까지 늘어나므로 &text= 로 따로 둡니다 (%25 = %).
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&text=0123456789%25&display=swap"
    />
    <!--
      3D 향 지도 로딩 커튼의 첫 칠 · 첫 진입의 향 원 세 개(body 의 #boot) — React 가 뜨기 전부터 움직여야 해서 여기 적습니다.
      짙고 작은 점이 차례로 연막탄처럼 터져 번지고(대 0.45초 · 중 1.15초 · 소 1.7초), 숨 쉬고 떠돕니다. 전부 합성 단계
      애니메이션이라 번들을 받는 동안이나 엔진이 메인 스레드를 막는 동안에도 흐릅니다.
      React 커튼(features/map 의 SceneBootCurtain)은 #boot 를 지우지 않고 그 위에 퍼센트만 얹었다가, 걷을 때 .is-leaving 으로
      같이 걷고 다 걷히면 지웁니다. (첫 판은 중 · 소를 React 가 그렸는데, 엔진이 곧바로 메인 스레드를 막아 1초 넘게 안 보였습니다)
      ⚠ features/map/scene-boot.css 의 세 원(앱 안에서 다시 들어올 때 React 가 그림)과 자리 · 크기 · 색 · 시각 · 곡선이 같아야 합니다.
        이름은 앞말만 다릅니다(boot-grow ↔ scene-boot-grow). 다시 들어올 때는 저쪽이 두 배 빠릅니다(--boot-tempo).
      색은 토큰(styles/index.css)이 오기 전이라 값으로 적었습니다 — dusk-gold rgb(217 190 134) · shimmer rgb(167 200 219) · sage rgb(127 138 122).
    -->
    <style>
      #boot {
        /* 로딩 길이 — scene-boot.css 의 --boot-tempo 와 같은 값이어야 합니다 (사용자 요청으로 1.5) */
        --boot-tempo: 1.5;
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
        /* 흰 바탕은 아래 커튼 두 짝이 깝니다 — 걷힐 때 가운데에서 좌우로 갈라집니다(커튼째 옅어지지 않습니다) */
      }
      /* 흰 안개 — 바탕 한 장 + 가장자리 넉 장. 걷힐 때 가운데부터 트입니다 (scene-boot.css 와 같은 값) */
      #boot .boot-haze {
        position: absolute;
        inset: 0;
        background: #fff;
        transition: opacity 800ms cubic-bezier(0.5, 0, 0.3, 1);
      }
      #boot .boot-haze-edge {
        position: absolute;
        background: linear-gradient(
          var(--edge-to),
          #fff 0 34%,
          rgb(255 255 255 / 0.55) 62%,
          transparent 100%
        );
        transition:
          translate 1100ms cubic-bezier(0.33, 0, 0.2, 1),
          opacity 800ms cubic-bezier(0.5, 0, 0.3, 1) 380ms;
      }
      #boot .boot-haze-t {
        --edge-to: to bottom;
        top: 0;
        left: -5%;
        right: -5%;
        height: 46%;
      }
      #boot .boot-haze-b {
        --edge-to: to top;
        bottom: 0;
        left: -5%;
        right: -5%;
        height: 46%;
      }
      #boot .boot-haze-l {
        --edge-to: to right;
        left: 0;
        top: -5%;
        bottom: -5%;
        width: 40%;
      }
      #boot .boot-haze-r {
        --edge-to: to left;
        right: 0;
        top: -5%;
        bottom: -5%;
        width: 40%;
      }
      #boot.is-leaving .boot-haze,
      #boot.is-leaving .boot-haze-edge {
        opacity: 0;
      }
      #boot.is-leaving .boot-haze-t {
        translate: 0 -22%;
      }
      #boot.is-leaving .boot-haze-b {
        translate: 0 22%;
      }
      #boot.is-leaving .boot-haze-l {
        translate: -22% 0;
      }
      #boot.is-leaving .boot-haze-r {
        translate: 22% 0;
      }
      #boot.is-leaving {
        pointer-events: none;
      }
      #boot .boot-scent {
        position: absolute;
        aspect-ratio: 1;
        translate: -50% -50%;
        transform: scale(3);
      }
      #boot.is-leaving .boot-scent {
        transform: scale(5.4);
        opacity: 0;
        transition:
          transform 1400ms cubic-bezier(0.65, 0, 0.35, 1),
          opacity 900ms cubic-bezier(0.65, 0, 0.35, 1) 200ms;
      }
      #boot .boot-scent-large {
        --dot: 0.027;
        --burst-at: 450ms;
        --burst-ms: 2800ms;
        top: 52%;
        left: 10%;
        width: calc(min(130vw, 200vh) / 3);
      }
      #boot .boot-scent-medium {
        --dot: 0.048;
        --pop-at: 1000ms;
        --burst-at: 1150ms;
        --burst-ms: 2300ms;
        top: 24%;
        left: 76%;
        width: calc(min(50vw, 88vh) / 3);
      }
      #boot .boot-scent-small {
        --dot: 0.06;
        --pop-at: 1550ms;
        --burst-at: 1700ms;
        --burst-ms: 2000ms;
        top: 80%;
        left: 84%;
        width: calc(min(36vw, 64vh) / 3);
      }
      #boot .boot-pop,
      #boot .boot-grow,
      #boot .boot-ink {
        position: absolute;
        inset: 0;
      }
      #boot .boot-scent-medium .boot-pop,
      #boot .boot-scent-small .boot-pop {
        animation: boot-pop calc(160ms * var(--boot-tempo))
          cubic-bezier(0.34, 1.56, 0.64, 1)
          calc(var(--pop-at) * var(--boot-tempo)) both;
      }
      #boot .boot-grow {
        animation: boot-grow calc(var(--burst-ms) * var(--boot-tempo))
          cubic-bezier(0.22, 1, 0.36, 1)
          calc(var(--burst-at) * var(--boot-tempo)) both;
      }
      #boot .boot-ink {
        animation: boot-ink calc(750ms * var(--boot-tempo))
          cubic-bezier(0.3, 0, 0.2, 1) calc(var(--burst-at) * var(--boot-tempo))
          both;
      }
      #boot .boot-orb {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        animation: boot-breathe 4.2s ease-in-out infinite alternate;
      }
      #boot .boot-scent-medium .boot-orb {
        animation-delay: -1.4s;
      }
      #boot .boot-scent-small .boot-orb {
        animation-delay: -2.8s;
      }
      #boot .boot-orb-mixed {
        background: var(--orb-base);
        -webkit-mask-image: radial-gradient(
          circle closest-side,
          #000 58%,
          transparent 100%
        );
        mask-image: radial-gradient(
          circle closest-side,
          #000 58%,
          transparent 100%
        );
      }
      #boot .boot-scent-large .boot-orb-mixed {
        --orb-base: rgb(243 196 157 / 0.34);
      }
      #boot .boot-scent-medium .boot-orb-mixed {
        --orb-base: rgb(179 166 205 / 0.3);
      }
      #boot .boot-scent-small .boot-orb-mixed {
        --orb-base: rgb(226 131 60 / 0.24);
      }
      #boot .boot-slot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: var(--wash-size, 90%);
        aspect-ratio: 1;
        animation: boot-spread calc(1400ms * var(--boot-tempo))
          cubic-bezier(0.22, 1, 0.36, 1)
          calc(var(--burst-at) * var(--boot-tempo)) both;
      }
      #boot .boot-slot-peach {
        --wash: rgb(243 196 157 / 0.88);
        --wash-x: -26%;
        --wash-y: -14%;
        --wash-duration: 13s;
      }
      #boot .boot-slot-gold {
        --wash: rgb(217 190 134 / 0.82);
        --wash-x: 28%;
        --wash-y: -6%;
        --wash-duration: 17s;
      }
      #boot .boot-slot-lilac {
        --wash: rgb(179 166 205 / 0.72);
        --wash-x: -4%;
        --wash-y: 30%;
        --wash-duration: 11s;
      }
      #boot .boot-slot-shimmer {
        --wash: rgb(167 200 219 / 0.45);
        --wash-size: 52%;
        --wash-x: 22%;
        --wash-y: 26%;
        --wash-duration: 15s;
      }
      #boot .boot-slot-sunset {
        --wash: rgb(226 131 60 / 0.68);
        --wash-x: 8%;
        --wash-y: -12%;
        --wash-duration: 12s;
      }
      #boot .boot-scent-medium .boot-slot-lilac {
        --wash: rgb(179 166 205 / 0.78);
        --wash-x: 10%;
        --wash-y: -14%;
      }
      #boot .boot-scent-medium .boot-slot-peach {
        --wash: rgb(243 196 157 / 0.7);
        --wash-size: 64%;
        --wash-x: -18%;
        --wash-y: 16%;
      }
      #boot .boot-scent-medium .boot-slot-shimmer {
        --wash-size: 50%;
        --wash-x: 18%;
        --wash-y: 24%;
        --wash-duration: 9s;
      }
      #boot .boot-scent-small .boot-slot-gold {
        --wash: rgb(217 190 134 / 0.62);
        --wash-size: 62%;
        --wash-x: -16%;
        --wash-y: 16%;
      }
      #boot .boot-scent-small .boot-slot-peach {
        --wash: rgb(243 196 157 / 0.55);
        --wash-size: 52%;
        --wash-x: 14%;
        --wash-y: 22%;
        --wash-duration: 14s;
      }
      #boot .boot-wash {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle closest-side,
          var(--wash) 0%,
          var(--wash) 30%,
          transparent 100%
        );
        animation: boot-drift var(--wash-duration) ease-in-out infinite
          alternate;
      }
      @keyframes boot-pop {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }
      @keyframes boot-grow {
        from {
          transform: scale(var(--dot));
        }
        to {
          transform: scale(1);
        }
      }
      /* 짙은 점은 안 보입니다 — 터지면서 배어 나옵니다 (사용자 2026-09-18) */
      @keyframes boot-ink {
        from {
          filter: brightness(0.6) saturate(2.8) contrast(1.1);
          opacity: 0;
        }
        8% {
          opacity: 0;
        }
        42% {
          opacity: 1;
        }
        to {
          filter: brightness(1) saturate(1) contrast(1);
          opacity: 1;
        }
      }
      @keyframes boot-breathe {
        from {
          transform: scale(0.94);
        }
        to {
          transform: scale(1.04);
        }
      }
      @keyframes boot-spread {
        from {
          transform: translate(-50%, -50%) scale(0.5);
        }
        to {
          transform: translate(
              calc(-50% + var(--wash-x)),
              calc(-50% + var(--wash-y))
            )
            scale(1);
        }
      }
      @keyframes boot-drift {
        from {
          transform: translate(-3%, 2%) scale(0.96);
        }
        to {
          transform: translate(4%, -3%) scale(1.06);
        }
      }
      /* 모션 줄이기 — 원은 처음부터 다 번진 채로. 선택자는 원별 규칙(#boot .boot-scent-medium .boot-pop)보다 약하지 않게 */
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-scent .boot-pop,
        #boot .boot-scent .boot-grow,
        #boot .boot-scent .boot-ink,
        #boot .boot-scent .boot-orb,
        #boot .boot-scent .boot-slot,
        #boot .boot-scent .boot-wash {
          animation: none;
        }
        #boot .boot-scent .boot-slot {
          transform: translate(
            calc(-50% + var(--wash-x)),
            calc(-50% + var(--wash-y))
          );
        }
      }
    </style>
  </head>
  <body>
    <!--
      3D 향 지도 로딩 커튼의 첫 칠 (2026-09-17). React 번들이 오기 전 빈 화면 대신 흰 바탕과
      짙고 작은 향 점을 먼저 보이고, 점들이 차례로 연막탄처럼 터져 번집니다. #root 의 형제라 첫 render 가 지우지 않습니다.
      React 커튼(features/map 의 SceneBootCurtain)이 이어받으면 data-adopted 를 달고, 걷을 때 같이 걷은 뒤 지웁니다.
      메인(/)이 아니면 아래 스크립트가 바로 지웁니다. 15초 안에 React 가 이어받지 못하면(번들 실패) 지웁니다.
      생김새는 head 의 <style> 에 있습니다.
    -->
    <div id="boot" aria-hidden="true">
      <i class="boot-haze"></i>
      <i class="boot-haze-edge boot-haze-t"></i>
      <i class="boot-haze-edge boot-haze-b"></i>
      <i class="boot-haze-edge boot-haze-l"></i>
      <i class="boot-haze-edge boot-haze-r"></i>
      <span class="boot-scent boot-scent-large">
        <span class="boot-pop">
          <span class="boot-grow">
            <span class="boot-ink">
              <span class="boot-orb boot-orb-mixed">
                <span class="boot-slot boot-slot-peach">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-gold">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-lilac">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-shimmer">
                  <i class="boot-wash"></i>
                </span>
              </span>
            </span>
          </span>
        </span>
      </span>
      <span class="boot-scent boot-scent-medium">
        <span class="boot-pop">
          <span class="boot-grow">
            <span class="boot-ink">
              <span class="boot-orb boot-orb-mixed">
                <span class="boot-slot boot-slot-lilac">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-peach">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-shimmer">
                  <i class="boot-wash"></i>
                </span>
              </span>
            </span>
          </span>
        </span>
      </span>
      <span class="boot-scent boot-scent-small">
        <span class="boot-pop">
          <span class="boot-grow">
            <span class="boot-ink">
              <span class="boot-orb boot-orb-mixed">
                <span class="boot-slot boot-slot-sunset">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-gold">
                  <i class="boot-wash"></i>
                </span>
                <span class="boot-slot boot-slot-peach">
                  <i class="boot-wash"></i>
                </span>
              </span>
            </span>
          </span>
        </span>
      </span>
    </div>
    <script>
      ;(function () {
        var boot = document.getElementById('boot')
        if (!boot) return
        if (location.pathname !== '/') {
          boot.remove()
          return
        }
        setTimeout(function () {
          var late = document.getElementById('boot')
          if (late && !late.hasAttribute('data-adopted')) late.remove()
        }, 15000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

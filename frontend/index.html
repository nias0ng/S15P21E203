<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="향을 탐색하고, 발견하고, 기록하는 향수 추천 서비스"
    />
    <title>향해 · 향수 추천 서비스</title>

    <!--
      웹폰트. 제목은 Noto Serif KR, 본문은 Noto Sans KR 입니다.
      CSS 의 @import 로 넣으면 스타일시트를 받은 뒤에야 폰트 요청이 시작되므로
      여기 <link> 로 둡니다. display=swap 이라 폰트가 늦어도 글자는 먼저 보입니다.
      굵기는 실제로 쓰는 것만 받습니다 (본문 400·500·700, 제목 600·700).
      Noto Serif KR 400 은 굵기를 따로 주지 않은 명조가 씁니다 — 3D 위 선실 말풍선 · 목록 화면의 소제목(text-2xl) 등.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap"
    />
    <!--
      3D 향 지도 로딩 커튼의 첫 칠 (body 의 #boot) — React 가 뜨기 전부터 칠해져 있어야 흰 화면이 한 번 비치지 않아
      여기 적습니다. **거의 흰 화면을 구름이 덮고 있다가, 다 뜨면 가운데 한 점에서 번지며 걷힙니다**
      (2026-09-18 사용자 : *"처음 웹페이지 들어올때 그냥 약간 아이보리 화면에서 가운데서 구름 걷히듯이 하는
      효과만 간단하게 넣자 1초 정도만"* · *"1~2초로하고 아이보리보단 약간의 흰색에 가까운 걸로"* ·
      *"커튼 처럼 좌우로 열리는데 점에서 확장되듯 구름 걷히듯 열리게"*).
      전부 합성 단계 애니메이션이라 번들을 받는 동안이나 엔진이 메인 스레드를 막는 동안에도 흐릅니다.
      React 커튼(features/map 의 SceneBootCurtain)은 #boot 를 지우지 않고 **언제 걷을지만** 정하고,
      걷을 때 .is-leaving 을 달아 같이 걷은 뒤 지웁니다.
      ⚠ features/map/scene-boot.css (앱 안에서 다시 들어올 때 React 가 그림)와 색 · 치수 · 시간이 같아야 합니다 —
        이름은 앞말만 다릅니다 (boot-veil ↔ scene-boot-veil).
      ⚠ 색은 토큰(styles/index.css)이 오기 전이라 값으로 적었습니다.
    -->
    <style>
      #boot {
        /* 거의 흰색 — 아이보리(#F9F6EF)보다 흰쪽이고 완전 흰색은 아닙니다 (사용자 : "완전 흰색은 눈아프고") */
        --boot-bg: #fcfbf8;
        --boot-cloud: 236 230 220;
        /* 트이기 시작하는 구멍과 그 가장자리가 흐려지는 끝 — 이 둘이 커지는 게 아니라 겹이 커집니다 */
        --boot-hole: 4vmin;
        --boot-hole-soft: 17vmin;
        --boot-open: 24;
        /* 걷히는 시간 — scene-boot.css 의 --boot-lift · SceneBootCurtain 의 LEAVE_MS 와 같은 값 */
        --boot-lift: 1000ms;
        --boot-ease: cubic-bezier(0.45, 0, 0.55, 1);
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: hidden;
      }
      #boot .boot-veil {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--boot-bg);
        will-change: transform, opacity;
        transition:
          transform var(--boot-lift) var(--boot-ease),
          opacity calc(var(--boot-lift) * 0.28) linear
            calc(var(--boot-lift) * 0.72);
      }
      /*
        가운데를 뚫고 통째로 키웁니다 — 마스크는 요소 좌표계라 구멍도 같이 커집니다.
        ⚠⚠ 마스크의 반지름을 애니메이션하지 않습니다 : mask-size · 그라데이션 정지점은 칠하기 단계라
          매 장 전 화면을 다시 칠합니다. transform 은 합성 단계라 공짜입니다 —
          구멍을 키우는 게 아니라 구멍을 가진 겹을 키웁니다.
      */
      #boot.is-leaving .boot-veil {
        mask-image: radial-gradient(
          circle at 50% 50%,
          transparent 0 var(--boot-hole),
          #000 var(--boot-hole-soft)
        );
        transform: scale(var(--boot-open));
        opacity: 0;
      }
      /*
        구름 결 — 덩어리 셋을 겹치고 통째로 흐립니다. 느리게 숨 쉽니다.
        ⚠ 한 요소에 transform 은 하나만 — 숨은 여기, 번지는 것은 부모(.boot-veil)입니다.
        ⚠ 흐림은 정적입니다. 투명 끝은 알파 0 이 아니라 0.004 입니다 (크롬이 알파 0 픽셀의 색을 버립니다)
      */
      #boot .boot-drift {
        position: absolute;
        inset: -15%;
        background:
          radial-gradient(
            38% 46% at 26% 32%,
            rgb(var(--boot-cloud) / 0.9),
            rgb(var(--boot-cloud) / 0.004) 72%
          ),
          radial-gradient(
            44% 40% at 72% 62%,
            rgb(var(--boot-cloud) / 0.85),
            rgb(var(--boot-cloud) / 0.004) 70%
          ),
          radial-gradient(
            54% 62% at 52% 44%,
            rgb(var(--boot-cloud) / 0.7),
            rgb(var(--boot-cloud) / 0.004) 78%
          ),
          var(--boot-bg);
        filter: blur(26px);
        animation: boot-breathe 7s ease-in-out infinite alternate;
      }
      @keyframes boot-breathe {
        from {
          transform: translate3d(-1.2%, 0.6%, 0) scale(1.02);
        }
        to {
          transform: translate3d(1.2%, -0.6%, 0) scale(1.05);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-drift {
          animation: none;
        }
        #boot .boot-veil {
          transition: opacity var(--boot-lift) linear;
        }
        #boot.is-leaving .boot-veil {
          mask-image: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      3D 향 지도 로딩 커튼의 첫 칠. React 번들이 오기 전 빈 화면 대신 거의 흰 바탕과 구름 결을
      먼저 보입니다. #root 의 형제라 첫 render 가 지우지 않습니다.
      React 커튼(features/map 의 SceneBootCurtain)이 이어받으면 data-adopted 를 달고, 걷을 때 같이 걷은 뒤 지웁니다.
      메인(/)이 아니면 아래 스크립트가 바로 지웁니다. 15초 안에 React 가 이어받지 못하면(번들 실패) 지웁니다.
      생김새는 head 의 <style> 에 있습니다.
    -->
    <div id="boot" aria-hidden="true">
      <i class="boot-veil"><i class="boot-drift"></i></i>
    </div>
    <script>
      ;(function () {
        var boot = document.getElementById('boot')
        if (!boot) return
        if (location.pathname !== '/') {
          boot.remove()
          return
        }
        setTimeout(function () {
          var late = document.getElementById('boot')
          if (late && !late.hasAttribute('data-adopted')) late.remove()
        }, 15000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

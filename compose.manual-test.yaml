name: hyanghae-manual-test

services:
  ai:
    build:
      context: ./ai
    image: hyanghae-ai:local
    environment:
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_MODEL: ${NLR_GMS_MODEL:-gpt-5.4-nano}
      NLR_LOG_PATH: /app/logs/unmatched.jsonl
    expose:
      - "8000"
    volumes:
      - nlr-logs:/app/logs

  backend:
    build:
      context: ./backend
    image: hyanghae-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: manual-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MANUAL_TEST_POSTGRES_DB:-hyanghae_test}
      SPRING_DATASOURCE_USERNAME: ${MANUAL_TEST_POSTGRES_USER:-hyanghae}
      SPRING_DATASOURCE_PASSWORD: ${MANUAL_TEST_POSTGRES_PASSWORD:-hyanghae_test}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_MODEL: ${BACKEND_GMS_MODEL:-gpt-5-nano}
      REVIEW_ANALYSIS_ENABLED: ${REVIEW_ANALYSIS_ENABLED:-false}
      # 자연어 추천이 부르는 AI 서버입니다. 같은 네트워크 안이라 서비스 이름으로 붙습니다.
      # ai 는 호스트 포트를 공개하지 않으므로 이 주소로만 닿습니다.
      NLR_AI_BASE_URL: http://ai:8000
      # 업로드 이미지를 실제 S3 · CloudFront 로 보내 확인하고 싶을 때만 켭니다. 기본은 꺼짐이고
      # 그때는 아래 manual-test-uploaded-images 볼륨에 쌓입니다.
      #
      #   $env:IMAGE_STORAGE_S3_ENABLED = "true"
      #   $env:AWS_ACCESS_KEY_ID = "..."        # 이 셸에서만. 아래에 직접 적지 마십시오.
      #   $env:AWS_SECRET_ACCESS_KEY = "..."
      #   docker compose -f compose.manual-test.yaml up -d backend
      #
      # ⚠ KEY_PREFIX 는 개발 경로(uploads/dev)로 둡니다. uploads 로 두면 수동 확인으로 올린
      # 사진이 실제 사용자 이미지 틈에 쌓이고, 이름이 UUID 라 나중에 골라낼 수 없습니다.
      #
      # ⚠ 이 파일은 저장소에 추적됩니다. 키를 값으로 적으면 커밋에 딸려 들어갑니다.
      IMAGE_STORAGE_S3_ENABLED: ${IMAGE_STORAGE_S3_ENABLED:-false}
      IMAGE_STORAGE_S3_BUCKET: ${IMAGE_STORAGE_S3_BUCKET:-hyanghae-images-prod-s15p21e203}
      IMAGE_STORAGE_S3_REGION: ${IMAGE_STORAGE_S3_REGION:-ap-northeast-2}
      IMAGE_STORAGE_S3_PUBLIC_BASE_URL: ${IMAGE_STORAGE_S3_PUBLIC_BASE_URL:-https://djpgc0m2v54q1.cloudfront.net}
      IMAGE_STORAGE_S3_KEY_PREFIX: ${IMAGE_STORAGE_S3_KEY_PREFIX:-uploads/dev}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # 회원가입 인증 메일은 기본으로 아래 mailpit 이 받습니다. 바깥으로 나가지 않고
      # http://127.0.0.1:8025 에서 읽을 수 있습니다. 실제 SMTP 로 확인할 때만 셸에서 MAIL_* 를
      # 덮어씁니다. 비밀번호를 여기에 값으로 적지 마십시오.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@hyanghae.local}
    ports:
      - "127.0.0.1:${MANUAL_TEST_BACKEND_PORT:-8080}:8080"
    # 올라온 이미지를 쌓는 곳입니다. 게시글 이미지와 프로필 사진이 이 아래의 서로 다른
    # 하위 디렉터리를 쓰므로 볼륨은 하나면 됩니다. 볼륨이 없으면 --build 로 다시 올릴 때마다
    # 그동안 올린 이미지가 사라지고 깨진 주소만 남습니다. 배포 서버의 compose.yaml 에도 같은
    # 볼륨이 있어야 합니다.
    volumes:
      - manual-test-uploaded-images:/app/uploads
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  seed:
    image: postgres:17
    profiles:
      - tools
    working_dir: /workspace/backend/db/seed
    environment:
      DB_NAME: ${MANUAL_TEST_POSTGRES_DB:-hyanghae_test}
      DB_USER: ${MANUAL_TEST_POSTGRES_USER:-hyanghae}
      PGPASSWORD: ${MANUAL_TEST_POSTGRES_PASSWORD:-hyanghae_test}
      DATABASE_URL: postgresql://${MANUAL_TEST_POSTGRES_USER:-hyanghae}@postgres:5432/${MANUAL_TEST_POSTGRES_DB:-hyanghae_test}
    volumes:
      - ./backend/db/seed:/workspace/backend/db/seed:ro
      - ./ai/delivery/for_db:/workspace/ai/delivery/for_db:ro
    depends_on:
      backend:
        condition: service_healthy
    command:
      - bash
      - -euc
      - |
        echo "[1/7] 향 지도 데이터를 넣습니다."
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f load_scent_map.sql
        echo "[2/7] 향수 카탈로그를 넣습니다."
        bash ./load_perfume_catalog.sh
        echo "[3/7] 보충 향수 카탈로그를 넣습니다."
        bash ./load_perfume_catalog_supplement.sh
        echo "[4/7] 향수 gender를 보강합니다."
        bash ./load_perfume_genders.sh
        echo "[5/7] 노트 메타데이터를 넣습니다."
        bash ./load_notes.sh
        echo "[6/7] 향수 이미지를 넣습니다."
        bash ./load_perfume_images.sh
        echo "[7/7] 향수-노트 연결을 넣습니다."
        bash ./load_perfume_notes.sh
        echo "모든 초기 데이터 적재가 끝났습니다."

  seed-local:
    build:
      context: ./backend
      dockerfile: db/seed/Dockerfile.local
    profiles:
      - tools
    environment:
      SEED_ENV: manual-test
      SEED_JDBC_URL: jdbc:postgresql://postgres:5432/${MANUAL_TEST_POSTGRES_DB:-hyanghae_test}
      SEED_DB_USER: ${MANUAL_TEST_POSTGRES_USER:-hyanghae}
      SEED_DB_PASSWORD: ${MANUAL_TEST_POSTGRES_PASSWORD:-hyanghae_test}
      SEED_LOGIN_PASSWORD: ${SEED_LOGIN_PASSWORD:-}
      SEED_MODE: fill
    volumes:
      - ./backend/db/seed:/workspace/backend/db/seed:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${MANUAL_TEST_POSTGRES_DB:-hyanghae_test}
      POSTGRES_USER: ${MANUAL_TEST_POSTGRES_USER:-hyanghae}
      POSTGRES_PASSWORD: ${MANUAL_TEST_POSTGRES_PASSWORD:-hyanghae_test}
    ports:
      - "${MANUAL_TEST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - manual-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${MANUAL_TEST_REDIS_PORT:-6379}:6379"
    volumes:
      - manual-test-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 로컬 확인용 가짜 메일 서버입니다. 받은 메일은 바깥으로 전달하지 않습니다.
  # SMTP 도 127.0.0.1 에 여는 것은 백엔드를 Compose 밖에서 bootRun 으로 띄울 때를 위해서입니다.
  # 그때 application.yaml 의 기본값(localhost:1025)이 여기로 닿습니다.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MANUAL_TEST_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MANUAL_TEST_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  manual-test-postgres-data:
  manual-test-redis-data:
  manual-test-uploaded-images:
  nlr-logs:
